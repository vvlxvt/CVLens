<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>CVLens — загрузка result.json</title>
  </head>
  <body>
    <h1>Загрузить result.json</h1>
    <form id="uploadForm">
      <input type="file" id="fileInput" accept="application/json" required />
      <button type="submit">Загрузить</button>
    </form>
    <pre id="output"></pre>

    <script>
      const API_URL = "http://127.0.0.1:8000/resumes/upload"; // поменяй, если API не на localhost:8000

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const file = document.getElementById("fileInput").files[0];
          const output = document.getElementById("output");
          if (!file) return;

          const formData = new FormData();
          formData.append("file", file); // имя поля "file" должно совпадать с параметром в FastAPI

          output.textContent =
            "Загрузка... это может занять несколько минут (LLM-обработка).";

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              body: formData, // без Content-Type — браузер сам проставит multipart/form-data с boundary
            });
            const data = await response.json();
            output.textContent = JSON.stringify(data, null, 2);
          } catch (err) {
            output.textContent = "Ошибка запроса: " + err;
          }
        });
    </script>
  </body>
</html>
