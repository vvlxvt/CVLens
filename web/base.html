<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CVLens — {% block title %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/styles.css" rel="stylesheet" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <header class="app-header py-3 mb-4">
      <div
        class="container-xl d-flex align-items-center justify-content-between"
      >
        <span class="brand"><i class="bi bi-search"></i> CVLens</span>
        <div class="d-flex align-items-center gap-3">
          {% block header_extra %}{% endblock %}
          <a href="/search" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-magnifying-glass-chart"></i> Поиск похожих
          </a>
          <a href="/prompts" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-magnifying-glass"></i> Промпты
          </a>
          <a href="/upload" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-folder-plus"></i> Загрузить
          </a>
          <a href="/" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-list"></i> Список CV
          </a>
        </div>
      </div>
    </header>

    <main class="container-xl pb-5">
      {% block index %}{% endblock %} 
      {% block upload %}{% endblock %} 
      {% block prompts %}{% endblock %} 
      {% block search %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://kit.fontawesome.com/6a1586a6f1.js"
      crossorigin="anonymous"
    ></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
