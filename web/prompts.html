<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVLens — промпты</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
<style>
  .prompt-col{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.85rem;
    padding: 1.25rem;
    height: 100%;
  }
  .prompt-col h5{
    font-weight: 700;
    margin-bottom: 0.15rem;
  }
  .prompt-meta{
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .status-badge{
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
  }
  .status-badge.active{
    background: var(--accent-soft);
    color: var(--accent-dark);
  }
  .status-badge.archived{
    background: #F1F2F4;
    color: var(--text-muted);
  }
  .prompt-col label{
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent-dark);
    margin-bottom: 0.35rem;
    display: block;
  }
  .prompt-col textarea{
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.85rem;
    resize: vertical;
  }
  .save-status{
    font-size: 0.85rem;
    min-height: 1.4em;
    margin-top: 0.6rem;
  }
</style>
</head>
<body>

<header class="app-header py-3 mb-4">
  <div class="container-xl d-flex align-items-center justify-content-between">
    <span class="brand"><i class="bi bi-search"></i> CVLens</span>
    <a href="index.html" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> К списку CV
    </a>
  </div>
</header>

<main class="container-xl pb-5">
  <h4 class="mb-4">Промпты для LLM-обработки</h4>

  <div class="row g-4">
    <!-- About / intro extraction -->
    <div class="col-lg-6">
      <div class="prompt-col">
        <h5>О себе / роль (intro_extraction)</h5>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="prompt-meta mb-0" id="aboutMeta">Загрузка…</div>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" id="aboutPrevBtn" title="Более старая версия">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button class="btn btn-outline-secondary" id="aboutNextBtn" title="Более новая версия">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>

        <label for="aboutSystem">System prompt</label>
        <textarea class="form-control mb-3" id="aboutSystem" rows="8"></textarea>

        <label for="aboutUser">User template <span class="text-muted normal-case">(должен содержать <code>{intro_text}</code>)</span></label>
        <textarea class="form-control mb-3" id="aboutUser" rows="10"></textarea>

        <button class="btn btn-accent" id="aboutSaveBtn">
          <i class="bi bi-save"></i> Сохранить
        </button>
        <div class="save-status" id="aboutStatus"></div>
      </div>
    </div>

    <!-- Feedback extraction -->
    <div class="col-lg-6">
      <div class="prompt-col">
        <h5>Фидбэк рекрутера (feedback_extraction)</h5>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="prompt-meta mb-0" id="feedbackMeta">Загрузка…</div>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" id="feedbackPrevBtn" title="Более старая версия">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button class="btn btn-outline-secondary" id="feedbackNextBtn" title="Более новая версия">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>

        <label for="feedbackSystem">System prompt</label>
        <textarea class="form-control mb-3" id="feedbackSystem" rows="8"></textarea>

        <label for="feedbackUser">User template <span class="text-muted normal-case">(должен содержать <code>{feedback_text}</code>)</span></label>
        <textarea class="form-control mb-3" id="feedbackUser" rows="10"></textarea>

        <button class="btn btn-accent" id="feedbackSaveBtn">
          <i class="bi bi-save"></i> Сохранить
        </button>
        <div class="save-status" id="feedbackStatus"></div>
      </div>
    </div>
  </div>
</main>

<script src="js/prompts.js"></script>
</body>
</html>
